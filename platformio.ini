; PlatformIO project for the InkSights firmware
;
; The sketch stays in firmware/InkSights/ so it also opens in the Arduino IDE.
; Build:   pio run -e <env>              (default environment only: pio run)
; Upload:  pio run -e <env> -t upload    (SAMD21: press RESET twice quickly if the port is not found;
;                                         ESP32: hold BOOT while plugging in if the port is not found)
; Monitor: pio device monitor
;
; Environments: one per board. Seeed XIAO SAMD21 (USB only), Seeed XIAO ESP32-C3 / ESP32-S3,
; ESP32-S3 / ESP32-C3 Super Mini and Zero, Adafruit QT Py ESP32-S3. Every firmware drives all panel
; types; the panel is chosen on the settings page (a new board starts with type 1, DEFAULT_PANEL).
; Board pins: firmware/InkSights/BoardProfile.h and the README.

[platformio]
src_dir = firmware/InkSights
default_envs = xiao-samd21

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.0
    adafruit/Adafruit GFX Library @ ^1.11.0
; No fixed port: PlatformIO finds the board by itself, or pick the port in the
; status bar (plug icon). A fixed upload_port / monitor_port here would override that choice.

; ---------------------------------------------------------------- boards

[samd21]
platform = atmelsam
board = seeed_xiao
lib_deps =
    ${env.lib_deps}
    cmaglie/FlashStorage @ ^1.0.0
build_flags = -DINKSIGHTS_BOARD_XIAO_SAMD21

[esp32]
platform = espressif32@7.0.1
; USB serial (CDC) on the USB-C port: the NAS server talks to the display over it
usb_cdc = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[esp32-s3-supermini]
extends = esp32
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_ESP32_S3_SUPERMINI

[esp32-s3-zero]
extends = esp32
board = esp32-s3-devkitm-1
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_ESP32_S3_ZERO

[esp32-c3-supermini]
extends = esp32
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_ESP32_C3_SUPERMINI

[esp32-c3-zero]
extends = esp32
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_ESP32_C3_ZERO

[seeed-xiao-esp32-c3]
extends = esp32
board = seeed_xiao_esp32c3
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_SEEED_XIAO_ESP32_C3

[seeed-xiao-esp32-s3]
extends = esp32
board = seeed_xiao_esp32s3
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_SEEED_XIAO_ESP32_S3

[adafruit-qtpy-esp32-s3-n4r2]
extends = esp32
board = adafruit_qtpy_esp32s3_n4r2
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_ADAFRUIT_QTPY_ESP32_S3_N4R2

[adafruit-qtpy-esp32-s3-nopsram]
extends = esp32
board = adafruit_qtpy_esp32s3_nopsram
build_flags = ${esp32.usb_cdc} -DINKSIGHTS_BOARD_ADAFRUIT_QTPY_ESP32_S3_NOPSRAM

; ---------------------------------------------------------------- environments (one per board)

[env:xiao-samd21]
extends = samd21

[env:seeed-xiao-esp32-c3]
extends = seeed-xiao-esp32-c3

[env:seeed-xiao-esp32-s3]
extends = seeed-xiao-esp32-s3

[env:esp32-s3-supermini]
extends = esp32-s3-supermini

[env:esp32-s3-zero]
extends = esp32-s3-zero

[env:esp32-c3-supermini]
extends = esp32-c3-supermini

[env:esp32-c3-zero]
extends = esp32-c3-zero

[env:adafruit-qtpy-esp32-s3-n4r2]
extends = adafruit-qtpy-esp32-s3-n4r2

[env:adafruit-qtpy-esp32-s3-nopsram]
extends = adafruit-qtpy-esp32-s3-nopsram
