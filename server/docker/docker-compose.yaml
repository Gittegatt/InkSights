# InkSights - settings page and script
# Adjust the lines marked with <-, then: sudo docker compose up -d
#
# Two containers from the same image: the settings page (no rights on the system) and the script
# (reads drives, pools, system values and USB ports, sends the displays their data; as root with
# access to the system, no port, no network of its own; it never wakes hard disks). Run the script
# only here, not also with tmux or cron on the system. Keep the data folder on an SSD.

name: inksights

services:
  inksights:                                    # the settings page
    image: ghcr.io/gittegatt/inksights:latest   # or a fixed version, e.g. :1.1.1
    container_name: inksights
    restart: unless-stopped
    user: 568:568                               # <- user with write access to the data folder (TrueNAS: apps)
    ports:
      - 8099:8099                               # <- left: port of the page on your server
    volumes:
      - ./data:/data                            # <- data folder on an SSD
      - /var/run/inksights:/run/inksights:ro    # run folder of the script, keep as is
    environment:
      - INKSIGHTS_OTA=on                        # firmware updates over WiFi from the page: on / off
      # Login (off by default, can also be switched on in the Login card of the page):
      # - INKSIGHTS_USER=inksights
      # - INKSIGHTS_PASSWORD=

  inksights-script:                             # the script: reads drives and system, sends the displays their data
    image: ghcr.io/gittegatt/inksights:latest   # the same as above
    container_name: inksights-script
    restart: unless-stopped
    command: /app/script-entry.sh -l            # more options at the end, e.g. -x sdz
    user: 0:0                                   # root, like a script started on the system
    privileged: true                            # needs the USB ports, drives and pools of the system
    pid: host                                   # runs the script on the system itself (its tools, its pools)
    network_mode: none                          # no network of its own, cannot be reached from outside
    stop_grace_period: 30s                      # on stop: time to finish the frame it is sending
    healthcheck:
      disable: true                             # no web server in this container
    volumes:
      - ./data:/data                            # <- the same data folder as above
    environment:
      - INKSIGHTS_DOCKER_CHECK=360              # <- Docker pages: minutes between checks for newer images (10 to 10080)
