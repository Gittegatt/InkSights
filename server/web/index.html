<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkSights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="inksights.css">
</head>
<body>
<!-- The page itself is built by inksights-ui.js (the same code as the simulator). -->
<main class="wrap" id="app"></main>

<script src="inksights-render.js"></script>
<script src="inksights-ui.js"></script>
<script>
"use strict";
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(res.error || `Error ${r.status}`);
  return res;
}

InkSightsUI.start({
  root: document.getElementById("app"),
  tabs: true,   // one tab per display, the preview beside its cards
  docker: true,   // the Docker card and pages (state.json carries the containers)
  dockerStacks: true,   // Docker: one row per stack
  load: async () => {
    const r = await fetch("api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  },
  save: body => post("api/config", body),
  refresh: () => post("api/refresh", {}),
  redraw: id => post("api/redraw", { id }),
  validate: body => post("api/validate", body),   // import of a backup: checked by the app, nothing saved
  // the Login card: switch the login of the page on (new password), change its password or switch it off
  // (the browser then asks for the login, or no longer)
  login: (on, current, next) => post("api/login", { on, current, next }),
  // firmware update over WiFi: the firmware the WebUI carries for the board, or a file chosen on the page
  ota: id => post("api/ota", { id }),
  otaFile: async (id, buf) => {
    const r = await fetch(`api/ota-file?id=${encodeURIComponent(id)}`, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: buf });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(res.error || `Error ${r.status}`);
    return res;
  },
  // the latest release on GitHub: { version, url }, null when there is none
  latest: async () => {
    const r = await fetch("https://api.github.com/repos/Gittegatt/InkSights/releases/latest", { headers: { Accept: "application/vnd.github+json" } });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    return typeof j.tag_name === "string" ? { version: j.tag_name, url: j.html_url || "https://github.com/Gittegatt/InkSights/releases" } : null;
  },
  // the latest frame of a display with fast refresh: { frame, age }
  live: async id => {
    const r = await fetch(`api/live?id=${encodeURIComponent(id)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  },
  pollMs: 10000,   // shows a display plugged in or out within seconds of the script noticing it
  serverAddress: location.origin,
  warnOnLeave: true,
});
</script>
</body>
</html>
