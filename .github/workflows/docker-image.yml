name: Build Docker image

# The settings page (WebUI) and the script as an image on the GitHub Container Registry:
# ghcr.io/gittegatt/inksights:<version> and :latest, for amd64 and arm64.
# Only in the public repository, on a version tag (v1.1.2, ...) or by hand.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    if: github.repository == 'Gittegatt/InkSights'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          app=$(sed -n 's/^VERSION = "\([0-9.]*\)".*/\1/p' server/web/inksights-web.py)
          if [ -z "$app" ]; then echo "VERSION not found in server/web/inksights-web.py"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the WebUI version ${app}"; exit 1
          fi
          fw=$(sed -n 's/.*FW_VERSION\[\] *= *"\([0-9.]*\)".*/\1/p' firmware/InkSights/InkSights.ino)
          if [ "$fw" != "$app" ]; then echo "Firmware ${fw} and WebUI ${app} differ"; exit 1; fi
          sh=$(sed -n 's/^VERSION="\([0-9.]*\)".*/\1/p' server/inksights.sh)
          if [ "$sh" != "$app" ]; then echo "Script ${sh} and WebUI ${app} differ"; exit 1; fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inksights" >> "$GITHUB_OUTPUT"
          echo "version=${app}" >> "$GITHUB_OUTPUT"

      # the firmware of every board with WiFi goes into the image (server/web/fw): the settings page
      # updates those boards over WiFi with it
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio intelhex

      - name: Build the firmware for updates over WiFi
        run: |
          args=""
          for env in seeed-xiao-esp32-c3 seeed-xiao-esp32-s3 esp32-s3-supermini esp32-s3-zero esp32-c3-supermini esp32-c3-zero adafruit-qtpy-esp32-s3-n4r2 adafruit-qtpy-esp32-s3-nopsram; do
            args="$args --environment $env"
          done
          python scripts/build_release.py $args --ota-dir server/web/fw

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
