name: Build Docker image

# The settings page (WebUI) as an image on the GitHub Container Registry:
# ghcr.io/gittegatt/inksights:<version> and :latest, for amd64 and arm64.
# Only in the public repository, on a version tag (v1.0, ...) or by hand.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    if: github.repository == 'Gittegatt/InkSights'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          app=$(sed -n 's/^VERSION = "\([0-9.]*\)".*/\1/p' server/web/inksights-web.py)
          if [ -z "$app" ]; then echo "VERSION not found in server/web/inksights-web.py"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the WebUI version ${app}"; exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inksights" >> "$GITHUB_OUTPUT"
          echo "version=${app}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
